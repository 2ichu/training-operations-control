# 프론트엔드 정적 파일 + API 리버스 프록시(같은 출처 — 세션 쿠키가 그대로 쓰인다).
# TLS 는 이 앞단(로드밸런서·호스트 nginx 등)에서 종료하는 것을 전제로 한다(docs/DEPLOY.md).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # 첨부 업로드 상한(백엔드 20MB) + 여유
  client_max_body_size 25m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;

  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # 백엔드 TRUST_PROXY 설정과 함께 감사로그에 실제 접속 IP 가 남는다
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # 빌드 산출물은 파일명에 해시가 붙어 있어 오래 캐시해도 된다
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # SPA: 알 수 없는 경로는 index.html(화면 라우팅은 브라우저에서). index.html 은 캐시하지 않는다
  location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    try_files $uri /index.html;
  }
}
