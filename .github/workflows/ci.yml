name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: training_owner
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: training_mgmt
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U training_owner -d training_mgmt"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # CI 전용 일회성 DB 자격증명(서비스 컨테이너 안에서만 유효)
      DATABASE_URL: postgres://training_owner:ci-only-password@localhost:5432/training_mgmt
      SEED_ADMIN_LOGIN_ID: ci_admin
      SEED_ADMIN_PASSWORD: Ci-only-passw0rd!
      SEED_ADMIN_NAME: CI 관리자
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # npm 11(Node 24 동봉)이어야 package-lock.json 과 npm ci 가 일치한다(npm 10 은 선택적 peer 의존성 처리 차이로 실패)
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      # migrate:up 이 --envPath .env 를 읽는다
      - run: echo "DATABASE_URL=$DATABASE_URL" > .env
      - run: npm run lint
      - run: npm run build
      - run: npm run db:verify
      - run: npm run migrate:up
      - run: npm run db:seed
      - run: npm test
      # e2e 는 깨끗한 DB 를 전제로 하므로(롤백 검증) 실제 COMMIT 을 남기는 db:verify:audit-tx 보다 먼저 실행한다
      - run: npm run test:e2e
      - run: npm run db:verify:live
      - run: npm run db:verify:rbac
      - run: npm run db:verify:audit-tx
      - name: migration down/up
        run: npm run migrate:down && npm run migrate:up

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # 배포 구성(compose.yaml·Dockerfile·nginx.conf) 스모크: 이미지 빌드 → 빈 볼륨에서 기동(마이그레이션·시드 포함) →
  # 헬스체크·화면 라우팅·로그인까지 nginx 를 거쳐 확인. 절차는 docs/DEPLOY.md 와 같다.
  deploy-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 배포 설정(CI 일회성 값)
        run: |
          cp deploy.env.example deploy.env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-only-password/; s/^SEED_ADMIN_LOGIN_ID=.*/SEED_ADMIN_LOGIN_ID=ci_admin/; s/^SEED_ADMIN_PASSWORD=.*/SEED_ADMIN_PASSWORD=Ci-only-passw0rd!/' deploy.env
          # TLS 없는 CI 에서 로그인까지 확인하려고 Secure 쿠키만 끈다(운영 금지 — DEPLOY.md 2절)
          echo 'SESSION_COOKIE_SECURE=false' >> deploy.env
      - run: docker compose --env-file deploy.env up -d --build --wait
      - name: 스모크 테스트
        run: |
          curl -fsS http://localhost:8080/api/v1/health
          curl -fsS -o /dev/null http://localhost:8080/courses            # SPA 경로 → index.html
          curl -fsS -c cookies -H 'Content-Type: application/json' -d '{"loginId":"ci_admin","password":"Ci-only-passw0rd!"}' http://localhost:8080/api/v1/auth/login -o /dev/null
          curl -fsS -b cookies http://localhost:8080/api/v1/auth/me | grep -q '"loginId":"ci_admin"'
      - if: failure()
        run: docker compose --env-file deploy.env logs
      - if: always()
        run: docker compose --env-file deploy.env down -v
